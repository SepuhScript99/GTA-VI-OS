# GTA VI OS (Vice OS) Performance and Security Tunings
# Version: 1.0 Stable

# --- Console Log Suppression ---
# Prevent kernel debug/info messages from spamming TTY1 before X starts
kernel.printk=4 4 1 7

# --- Memory and Swap Optimization ---
# WARNING: High swappiness is intentional and recommended for ZRAM.
# ZRAM is compressed RAM, which is significantly faster than disk swap.
# Do NOT change this to 10 unless you disable ZRAM.
vm.swappiness=100
vm.vfs_cache_pressure=50
vm.dirty_background_ratio=5
vm.dirty_ratio=15
vm.watermark_boost_factor=10000
vm.watermark_scale_factor=75
vm.min_free_kbytes=16384
# CRITICAL for ZRAM: Read 1 page at a time instead of 4 to avoid unnecessary decompression
vm.page-cluster=0

# --- SSD Optimization ---
vm.dirty_writeback_centisecs=1500

# --- Network Security ---
net.ipv4.tcp_syncookies=1
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0

# --- Network Performance ---
# Use fq_codel + CUBIC (verified fastest across VirtualBox NAT slirp, multi-VM, and WAN)
net.core.default_qdisc=fq_codel
net.ipv4.tcp_congestion_control=cubic
# Enable TCP Path MTU probing to prevent silent packet drops / upload stalls
net.ipv4.tcp_mtu_probing=1
# Disable slow start after idle to maintain throughput on persistent connections
net.ipv4.tcp_slow_start_after_idle=0

# Expand local port range to prevent exhaustion
net.ipv4.ip_local_port_range=1024 65535

# Increase network buffers and default write memory (262144) for faster upload/download bursts
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 87380 16777216
net.ipv4.tcp_wmem=4096 262144 16777216
net.ipv4.tcp_fastopen=3

# Enable IP Forwarding (Required for Docker support)
net.ipv4.ip_forward=1

# --- Kernel Security & Hardening ---
kernel.dmesg_restrict=1
kernel.yama.ptrace_scope=1
kernel.kptr_restrict=2
kernel.unprivileged_bpf_disabled=1
dev.tty.ldisc_autoload=0
fs.suid_dumpable=0

# Append PID to core dumps for easier debugging
kernel.core_uses_pid=1
# Modern 64-bit system default for PID max
kernel.pid_max=4194304

# Magic SysRq key: 176 = enable sync, remount-ro, and boot (safe recovery)
kernel.sysrq=176

# Symlink and hardlink protection (standard hardening)
fs.protected_symlinks=1
fs.protected_hardlinks=1
fs.protected_fifos=2
fs.protected_regular=2

# --- CPU Scheduler optimization ---
kernel.sched_migration_cost_ns=5000000
kernel.sched_autogroup_enabled=1

# --- Filesystem Performance ---
fs.file-max=2097152
# Increase inotify watches for modern file managers and VS Code
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=512

# --- Gaming & Container Development ---
# Required by Steam Play (Proton/Wine) and Elasticsearch
vm.max_map_count=262144
