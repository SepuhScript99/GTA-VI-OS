# GRUB Configuration for GTA VI OS (Vice OS) v1.0
set default=0
set fallback=1
set timeout=3

# Load required modules for broad hardware compatibility
insmod part_gpt
insmod part_msdos
insmod iso9660
insmod hfsplus
insmod all_video
insmod font
insmod gfxterm

# Search for the marker file to find the live media
# Fallback to volume label if the marker file is missing
if ! search --no-floppy --set=root --file /VICE_OS; then
    search --no-floppy --set=root --label VICE_OS
fi

# Load unicode font safely and fall back to text console if unavailable
if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=auto
    set gfxpayload=keep
    terminal_input console at_keyboard
    terminal_output gfxterm
elif loadfont unicode; then
    set gfxmode=auto
    set gfxpayload=keep
    terminal_input console at_keyboard
    terminal_output gfxterm
else
    terminal_input console
    terminal_output console
fi

# Neon Miami Aesthetic Colors
set color_normal=light-cyan/black
set menu_color_normal=cyan/black
set menu_color_highlight=magenta/black

menuentry "GTA VI OS (Vice OS) [Live]" --id=0 {
    # root=live:LABEL=VICE_OS explicitly tells live-boot where the squashfs is
    # fsck.mode=skip speeds up boot by skipping checks on the read-only squashfs
    # Removed vm.swappiness to let /etc/sysctl.d/99-vice-os.conf (ZRAM optimized) handle it
    linux /vmlinuz root=live:LABEL=VICE_OS boot=live components quiet loglevel=3 systemd.show_status=0 fsck.mode=skip
    initrd /initrd.img
}

menuentry "GTA VI OS (Vice OS) [Safe Graphics (Nomodeset)]" --id=1 {
    linux /vmlinuz root=live:LABEL=VICE_OS boot=live components quiet loglevel=3 nomodeset fsck.mode=skip
    initrd /initrd.img
}

menuentry "GTA VI OS (Vice OS) [Debug Mode]" --id=2 {
    linux /vmlinuz root=live:LABEL=VICE_OS boot=live components loglevel=7 systemd.show_status=1 fsck.mode=skip
    initrd /initrd.img
}

menuentry "GTA VI OS (Vice OS) [Serial Console]" --id=3 {
    # ttyS0,115200n8 enables serial output for QEMU/headless environments
    linux /vmlinuz root=live:LABEL=VICE_OS boot=live components quiet loglevel=7 systemd.show_status=1 fsck.mode=skip console=ttyS0,115200n8
    initrd /initrd.img
}
