# GTA VI OS (Vice OS) Kernel Module Blacklist
#
# Prevents loading of legacy and problematic kernel modules.
# Note: Wi-Fi, Ethernet, VM, and audio drivers (see vice-audio-vm.conf)
# remain enabled for universal bare-metal and multi-hypervisor support.

# Disable floppy driver
# Causes boot delays and syslog spam on modern systems without floppy drives.
blacklist floppy

# Disable PC Speaker
# Prevents the annoying terminal beep sound.
blacklist pcspkr

# Disable PC Speaker sound driver
blacklist snd_pcsp
