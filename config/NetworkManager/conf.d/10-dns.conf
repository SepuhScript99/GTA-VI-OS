# GTA VI OS (Vice OS) NetworkManager DNS Configuration
# 
# Forces NetworkManager to manage /etc/resolv.conf directly using the
# DHCP/DNS settings it obtains. This prevents conflicts with systemd-resolved,
# which is intentionally disabled in the Live ISO.

[main]
dns=default
# Explicitly manage resolv.conf as a standard file to prevent symlink issues.
rc-manager=file

# Use a stable connection ID to prevent DHCP/IPv6 instability across reboots
[connection]
stable-id=${CONNECTION}/${BOOT}