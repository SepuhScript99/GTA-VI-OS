# GTA VI OS (Vice OS) NetworkManager Plug-and-Play Auto-Connect Configuration
# Installed to /etc/NetworkManager/conf.d/20-vice-autoconnect.conf
# Ensures wired, VM (VirtualBox/VMware/QEMU/Hyper-V), USB-tether, and Wi-Fi
# adapters are managed and brought online automatically with zero manual setup.

[main]
plugins=ifupdown,keyfile
dhcp=internal
no-auto-default=

[ifupdown]
managed=true

[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.powersave=2
