# GTA VI OS (Vice OS) Lightweight VM-Safe Picom Compositor Config
# Compatible with standard Debian Bookworm 'picom' (9.x) package.
# Uses xrender with shadows, blur, and fading disabled so VirtualBox/VMware
# software GPUs (vmsvga without 3D, llvmpipe, softpipe) stay responsive and
# YouTube/video playback never burns CPU on software compositing, while adding
# Windows 11-inspired soft rounded corners on floating windows.

backend = "xrender";
vsync = false;

# Disable unnecessary DBus overhead
dbus = false;

# Help the compositor track active EWMH focus smoothly with Openbox
use-ewmh-active-win = true;

# --- Performance Tunings (Crucial for VMs & Video Playback) ---
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = false;

# Unredirect fullscreen windows (including Firefox/mpv/browsers) so video
# players render directly without software compositing overhead
unredir-if-possible = true;
unredir-if-possible-exclude = [];

# --- Windows 11 Soft Rounded Corners (Verified zero-warning on Bookworm picom 9.1) ---
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'tooltip'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'menu'",
    "window_type = 'notification'",
    "class_g = 'vice_shell.py'",
    "name = 'ViceTaskbar'",
    "fullscreen",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_HORZ'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_MAXIMIZED_VERT'"
];

# --- Transparency ---
opacity-rule = [];

# --- Blur ---
# Disabled for xrender and VM software-GL performance
blur-background = false;
blur-background-frame = false;

# --- Shadows ---
# Disabled by default to eliminate software XRender shadow blur CPU cost in VMs
shadow = false;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'vice_shell.py'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'",
    "bounding_shaped"
];

# --- Fading ---
# Disabled to avoid frame repaints on window open/close/menu transitions in VMs
fading = false;

# --- Window Type Settings ---
wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 0.95; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
  utility = { shadow = false; };
  toolbar = { shadow = false; };
};
