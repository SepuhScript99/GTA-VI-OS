# GTA VI OS (Vice OS) Neon Miami Aesthetic Compositor
# Compatible with standard Debian Bookworm 'picom' package.
# Note: Rounded corners are handled by Openbox theme, not picom, to ensure
# compatibility with upstream picom.

backend = "xrender";
vsync = false;

# Enable DBus so applications can request blur/opacity changes dynamically
dbus = true;
# Enable multi-monitor support
xinerama-support = true;
# Help the compositor handle EWMH focus events more smoothly with Openbox
use-ewmh-active-win = true;

# --- Performance Tunings (Crucial for VMs) ---
use-damage = true;
# detect-rounded-corners ensures shadows respect GTK rounded windows
detect-rounded-corners = true;
detect-client-opacity = true;

# Unredirect fullscreen windows for better gaming/video performance
unredir-if-possible = true;
# Exclude media players and browsers so they keep vsync/color correction
unredir-if-possible-exclude = [
    "name *= 'mpv'",
    "class_g = 'mpv'",
    "class_g = 'Firefox'",
    "class_g = 'Chromium'",
    "class_g = 'Google-chrome'"
];

# --- Transparency ---
opacity-rule = [
    "90:class_g = 'xterm'",
    "90:class_g = 'qterminal'",
    "90:class_g = 'Alacritty'",
    "90:class_g = 'Pavucontrol'",
    "85:class_g = 'Geany'"
];

# --- Blur ---
# Disabled by default for xrender/VM compatibility (enable with backend = "glx" on bare metal GPU)
blur-background = false;
blur-background-frame = false;

# --- Shadows ---
shadow = true;
shadow-radius = 12;
shadow-offset-x = -6;
shadow-offset-y = -6;
# Slightly increased opacity for visibility on dark neon backgrounds
shadow-opacity = 0.7;
# Prevent shadows on shaped windows (e.g., terminal borders)
shadow-ignore-shaped = true;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'vice_shell.py'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'"
];

# --- Fading ---
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# --- Window Type Settings ---
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.9; };
  dropdown_menu = { opacity = 0.9; };
  utility = { shadow = false; };
  toolbar = { shadow = false; };
};
