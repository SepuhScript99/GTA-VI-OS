# GTA VI OS (Vice OS) Neofetch Configuration
# Installed to ~/.config/neofetch/config.conf via /etc/skel

print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "Theme" theme
    info "Icons" icons
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory

    info cols
}

# --- Distro & System Formatting ---
title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="on"
memory_percent="on"
memory_unit="mib"
package_managers="on"
shell_path="off"
shell_version="on"
speed_type="bios_limit"
speed_shorthand="off"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"
refresh_rate="on"
gtk_shorthand="off"
gtk2="on"
gtk3="on"

# --- Leonida Coastal Sunset Text & Color Blocks ---
# (title, @, underline, subtitle, colon, info)
colors=(1 15 3 6 7 15)
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"

color_blocks="on"
block_width=3
block_height=1
col_offset="auto"

bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length=15
bar_color_elapsed="distro"
bar_color_total="distro"

# --- GTA VI x Debian Swirl Artwork ---
image_backend="ascii"
image_source="/etc/vice-os/vice_ascii.txt"
ascii_distro="auto"
# c1=Magenta, c2=Coral, c3=Peach, c4=Gold, c5=Alabaster, c6=Vice Aqua
ascii_colors=(5 1 9 3 15 6)
ascii_bold="on"
image_loop="off"
crop_mode="normal"
crop_offset="center"
image_size="auto"
gap=3
yoffset=0
xoffset=0
background_color=
stdout="off"
