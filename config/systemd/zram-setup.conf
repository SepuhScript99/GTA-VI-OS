# GTA VI OS (Vice OS) ZRAM Configuration
#
# This file is sourced by the zram-setup.service systemd unit.
# Modify these values to change the ZRAM block device parameters.

# Size of the ZRAM block device (e.g., 1G, 2G, 4G, or 50% of RAM)
ZRAM_SIZE=2G

# Compression algorithm (options: lz4, lzo, zstd, deflate)
# lz4 is recommended for the best balance of speed and compression ratio.
ZRAM_ALGO=lz4

# Swap priority (higher number = higher priority over disk swap)
# ZRAM should always be prioritized over disk-based swap.
ZRAM_PRIORITY=10