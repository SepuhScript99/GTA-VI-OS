# GTA VI OS (Vice OS) Session Configuration
#
# Determines which display server session to launch on login.
# This file is read by ~/.profile during auto-login on tty1.
#
# Values:
#   x11     — X11 session with Openbox + picom + login.py greeter (default)
#   wayland — Wayland session with labwc compositor (native Wayland shell)
#
# User override: copy to ~/.config/vice-os/session.conf and change SESSION_TYPE.
# Changes take effect on next login (Ctrl+Alt+F1 to re-login).

SESSION_TYPE=x11
SESSION=x11
