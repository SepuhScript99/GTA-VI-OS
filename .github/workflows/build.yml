name: Build Vice OS ISO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        df -h

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          debootstrap debian-archive-keyring grub-common grub2-common \
          grub-efi-amd64-bin grub-pc-bin mtools dosfstools \
          xorriso squashfs-tools curl genisoimage

    - name: Build ISO
      run: |
        sudo bash build_iso.sh --clean
      timeout-minutes: 60

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gta-vi-os-amd64
        path: |
          out/gta-vi-os-amd64.iso
          out/SHA256SUMS
          out/build_info.txt
        retention-days: 14
        if-no-files-found: error

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
        if-no-files-found: ignore